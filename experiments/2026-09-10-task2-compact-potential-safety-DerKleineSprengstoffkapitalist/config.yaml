schema_version: 1
issue: 133
status: registered_pending_approval
evidence_scope: preregistered_development_experiment
agent: DerKleineSprengstoffkapitalist
owner: LiliWestermann
reviewer: 1BlauNitrox

revisions:
  registration_base: "124e5fa"
  experiment_commit: "6ae0de76ae544eeae94f8ca94f32b54eabe3e8b8"
  framework_revision: "b31c6c16cab62f47794f2600a8c3b1b677cb05d1"

treatments:
  control:
    state_representation: compact_decision
    potential_shaping: none
    tabular_initialization: zeros
    run_plan: training/run_plans/issue133-compact-task2-control.yaml

  candidate:
    state_representation: compact_decision
    potential_shaping: compact_safety
    tabular_initialization: zeros
    run_plan: training/run_plans/issue133-compact-task2-potential-safety.yaml

potential:
  safe: 0.0
  danger_with_safe_direction: -1.0
  danger_without_safe_direction: -2.0
  formula: gamma_phi_next_minus_phi_current
  discount_factor: 0.9
  terminal_next_potential: 0.0

controlled:
  algorithm: one_step_tabular_q_learning
  learning_rate: 0.05
  discount_factor: 0.9
  initial_epsilon: 1.0
  epsilon_decay: 0.99
  minimum_epsilon: 0.1
  action_masking: none
  useful_bomb_reward: 0.0
  state_representation: compact_decision
  q_value_initialization: zeros
  opponents: []
  replicas: 5
  episodes_per_replica: 10000

training:
  curriculum:
    - {scenario: coin-heaven, rounds: 2000}
    - {scenario: loot-crate, rounds: 2000}
    - {scenario: classic, rounds: 6000}

evaluation:
  rounds_per_seed: 1
  deterministic_repeat: true
  development_seeds_per_scenario: 40
  confirmation_seeds_used: false

primary_metric:
  name: classic_self_kill_rate
  contrast: candidate_minus_control
  pairing:
    - replica
    - world_seed

criteria:
  classic_self_kill_rate_below_control: true
  classic_collection_fraction_maximum_decrease: 0.05
  replicas_with_lower_self_kill_minimum: 4
  mean_visits_per_state_candidate_control_ratio_minimum: 0.90
  deterministic_repeat: true
  decision_time_p95_ms_max_exclusive: 50
  decision_time_max_ms_max_exclusive: 100

analysis:
  bootstrap_resamples: 10000
  safety_resampler_seed: 133
  collection_resampler_seed: 134
  learning_resampler_seed: 135

compute_budget:
  maximum_training_episodes: 100000
  maximum_evaluation_episodes: 2480
  planned_evaluation_episodes: 2400
  maximum_cpu_hours: 36
  paid_resources: false

approval:
  required_before_training: true
  approved_by: pending
  approved_commit: pending

outputs:
  commit:
    - README.md
    - config.yaml
    - summary.csv
    - result.json
    - figures/
  external:
    - trained_models
    - resolved_plans
    - statuses
    - per_episode_evidence
    - evaluation_metadata