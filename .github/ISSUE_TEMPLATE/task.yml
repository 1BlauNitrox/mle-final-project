name: General task
description: Create a documentation, research, setup, test, or maintenance task.
title: "task: "
labels:
  - task
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What concrete outcome is needed?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context and motivation
      description: Why does this matter now?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or blockers
      description: Write "None" if there are no blockers.
    validations:
      required: true
