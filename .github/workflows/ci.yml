name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint team-owned Python
        run: ruff check tests training scripts agent_code/_team_agent_template agent_code/DerKleineVermoegensumverteiler

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest

  smoke:
    name: Bomberman smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install headless runtime dependencies
        run: python -m pip install numpy tqdm

      - name: Play one complete headless round
        run: python main.py play --agents random_agent --no-gui --n-rounds 1 --seed 1
